<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ParkAlert: a coaster loop at dusk (night blue into a sunset orange; no purple), with an alert badge. Source for every
       PNG in this folder; maskable-*.png are the same art pulled in to the
       Android safe zone. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a33"/>
      <stop offset="0.52" stop-color="#17406b"/>
      <stop offset="0.66" stop-color="#2f6a8f"/>
      <stop offset="0.7" stop-color="#e98a4a"/>
      <stop offset="1" stop-color="#ff9f55"/>
    </linearGradient>
    <path id="track" d="M-20 408 C 70 408, 150 402, 214 374 C 298 338, 350 292, 350 226 C 350 166, 306 126, 252 126 C 198 126, 154 168, 154 226 C 154 286, 202 334, 266 360 C 336 388, 420 398, 466 362 C 494 340, 512 314, 540 290"/>
    <!-- Rails: a wide stroke with its middle cut out, so the sky shows between them. -->
    <mask id="rails" maskUnits="userSpaceOnUse" x="-40" y="-40" width="600" height="600">
      <use href="#track" fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#track" fill="none" stroke="#000" stroke-width="14" stroke-linecap="butt" stroke-linejoin="round"/>
    </mask>
    <radialGradient id="glow">
      <stop offset="0.55" stop-color="#ff3b30" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="78" cy="88" r="4.5" opacity="0.9"/><circle cx="148" cy="54" r="3" opacity="0.7"/>
    <circle cx="52" cy="172" r="2.5" opacity="0.6"/><circle cx="204" cy="82" r="2.5" opacity="0.6"/>
  </g>
  <g stroke="#fff" stroke-opacity="0.28" stroke-width="7">
    <path d="M70 404V512M130 400V512M400 390V512M456 370V512M252 330V512"/>
  </g>
  <g>
    <!-- Crossties under the rails. -->
    <use href="#track" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="48" stroke-dasharray="5 17"/>
    <rect width="512" height="512" fill="#fff" mask="url(#rails)"/>
  </g>
  <circle cx="416" cy="104" r="92" fill="url(#glow)"/>
  <circle cx="416" cy="104" r="58" fill="#ff3b30"/>
</svg>
